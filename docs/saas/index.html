  <!-- 开发期禁用缓存：给同源 .md/.js/.css 请求追加时间戳，强制实时加载 -->
  <script>
    (function () {
      function bustUrl(u) {
        if (!u || /^(https?:)?\/\//.test(u) || u.indexOf('_t=') > -1) return u;
        return u + (u.indexOf('?') > -1 ? '&' : '?') + '_t=' + Date.now();
      }
      if (window.fetch) {
        var _f = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          if (/\.(md|js|css)(\?|#|$)/.test(url)) {
            if (typeof input === 'string') input = bustUrl(url);
            else if (input && input.url) input = new Request(bustUrl(input.url), input);
          }
          return _f.call(this, input, init);
        };
      }
      var mo = window.MutationObserver && new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          m.addedNodes.forEach(function (n) {
            if (n.tagName === 'SCRIPT' && n.src) n.src = bustUrl(n.src);
            if (n.tagName === 'LINK' && n.href) n.href = bustUrl(n.href);
          });
        });
      });
      if (mo) mo.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
